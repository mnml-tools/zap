[package]
name = "zap"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "postgres", "mysql", "sqlite"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread"] }
url = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

futures-util = "0.3"

# Avoid malformed proc-macro dylibs on macOS toolchains affected by rust-lang/rust#157750.
[profile.release]
strip = "none"
